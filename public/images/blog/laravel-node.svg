<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Laravel vs Node.js">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a231a"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="r" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#e6a514" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e6a514" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#r)"/>
  
  <g font-family="Segoe UI, Arial, sans-serif" font-weight="800">
    <rect x="130" y="150" width="400" height="300" rx="32" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
    <rect x="670" y="150" width="400" height="300" rx="32" fill="#e6a514" fill-opacity="0.15" stroke="#e6a514" stroke-opacity="0.4"/>
    <text x="330" y="320" text-anchor="middle" font-size="64" fill="#ffffff">Laravel</text>
    <text x="870" y="320" text-anchor="middle" font-size="64" fill="#e6a514">Node.js</text>
    <text x="600" y="320" text-anchor="middle" font-size="48" fill="#ffffff" fill-opacity="0.5">vs</text>
  </g>
  <text x="90" y="660" font-family="Consolas, Menlo, monospace" font-size="54" font-weight="700" fill="#e6a514">php artisan | node</text>
</svg>
