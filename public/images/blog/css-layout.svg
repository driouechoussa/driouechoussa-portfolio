<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="CSS Grid and Flexbox">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a231a"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="r" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#e6a514" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e6a514" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#r)"/>
  
  <g fill="#e6a514">
    <rect x="620" y="110" width="200" height="200" rx="20"/>
    <rect x="840" y="110" width="260" height="200" rx="20" fill-opacity="0.35"/>
    <rect x="620" y="330" width="480" height="140" rx="20" fill-opacity="0.6"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.15">
    <rect x="110" y="150" width="120" height="80" rx="14"/><rect x="250" y="150" width="180" height="80" rx="14"/><rect x="450" y="150" width="90" height="80" rx="14"/>
    <rect x="110" y="260" width="430" height="80" rx="14"/>
  </g>
  <text x="90" y="660" font-family="Consolas, Menlo, monospace" font-size="54" font-weight="700" fill="#e6a514">display: grid;</text>
</svg>
