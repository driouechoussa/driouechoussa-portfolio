<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Designing for RTL">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a231a"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="r" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#e6a514" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e6a514" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#r)"/>
  
  <g fill="none" stroke="#e6a514" stroke-width="4" stroke-linecap="round">
    <path d="M1080 220H700"/><path d="M740 180l-40 40 40 40"/>
    <path d="M140 400h380"/><path d="M480 360l40 40-40 40"/>
  </g>
  <text x="1080" y="340" text-anchor="end" font-family="Cairo, Tahoma, sans-serif" font-size="88" font-weight="700" fill="#ffffff">مرحبا</text>
  <text x="140" y="520" font-family="Segoe UI, Arial, sans-serif" font-size="80" font-weight="700" fill="#ffffff" fill-opacity="0.85">Bonjour · Hello</text>
  <text x="90" y="660" font-family="Consolas, Menlo, monospace" font-size="54" font-weight="700" fill="#e6a514">dir="rtl"</text>
</svg>
