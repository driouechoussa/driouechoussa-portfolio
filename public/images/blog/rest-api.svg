<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="REST APIs with Node.js">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a231a"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="r" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#e6a514" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e6a514" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#r)"/>
  
  <g font-family="Consolas, Menlo, monospace" font-size="30" fill="#ffffff" fill-opacity="0.85">
    <rect x="560" y="120" width="540" height="380" rx="24" fill="#120f0b" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="600" cy="160" r="8" fill="#e6a514"/><circle cx="628" cy="160" r="8" fill="#ffffff" fill-opacity="0.2"/><circle cx="656" cy="160" r="8" fill="#ffffff" fill-opacity="0.2"/>
    <text x="600" y="230"><tspan fill="#e6a514">app</tspan>.get(<tspan fill="#9fd3a0">'/invoices'</tspan>,</text>
    <text x="640" y="280">validate(schema),</text>
    <text x="640" y="330">async (req, res) =&gt; {</text>
    <text x="680" y="380">res.json(<tspan fill="#e6a514">data</tspan>)</text>
    <text x="640" y="430">});</text>
  </g>
  <g stroke="#e6a514" stroke-width="3" fill="none" stroke-opacity="0.6">
    <path d="M120 260h200l60 60h120"/><path d="M120 360h160l60-60"/><circle cx="120" cy="260" r="10" fill="#e6a514"/><circle cx="120" cy="360" r="10" fill="#e6a514"/>
  </g>
  <text x="90" y="660" font-family="Consolas, Menlo, monospace" font-size="54" font-weight="700" fill="#e6a514">GET /api/v1</text>
</svg>
