<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="From Junior to Full-Stack">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a231a"/>
      <stop offset="1" stop-color="#17130e"/>
    </linearGradient>
    <radialGradient id="r" cx="0.8" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#e6a514" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e6a514" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#g)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect width="1200" height="750" fill="url(#r)"/>
  
  <g stroke="#e6a514" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M140 520C340 520 380 380 560 380S800 220 1060 160"/>
  </g>
  <g fill="#17130e" stroke="#e6a514" stroke-width="5">
    <circle cx="140" cy="520" r="18"/><circle cx="560" cy="380" r="18"/><circle cx="1060" cy="160" r="18"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" fill-opacity="0.85">
    <text x="110" y="480">Junior</text><text x="520" y="340">Mid</text><text x="900" y="130">Full-Stack</text>
  </g>
  <text x="90" y="660" font-family="Consolas, Menlo, monospace" font-size="54" font-weight="700" fill="#e6a514">git log --oneline</text>
</svg>
